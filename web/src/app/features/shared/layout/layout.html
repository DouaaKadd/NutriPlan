<aside class="fixed h-full w-[280px] left-0 top-0 bg-surface border-r border-outline-variant flex flex-col py-8 z-40">
  <div class="px-8 mb-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-primary flex items-center justify-center rounded-lg">
        <span class="material-symbols-outlined text-white">restaurant</span>
      </div>
      <h1 class="text-headline-md font-bold text-on-surface">NutriPlan</h1>
    </div>
    <p class="text-body-sm text-on-surface-variant mt-1 opacity-70">Salud y Nutrición</p>
  </div>

  <nav class="flex-1 space-y-1 px-4">
    @for (item of nav; track item.path) {
      <a [routerLink]="item.path"
         routerLinkActive="bg-secondary-container text-on-secondary-container border-l-4 border-primary font-bold"
         [routerLinkActiveOptions]="{ exact: false }"
         class="text-on-surface-variant hover:bg-surface-container px-4 py-3 flex items-center gap-3 transition-all duration-200 rounded-r-lg">
        <span class="material-symbols-outlined">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="mt-auto px-4 border-t border-outline-variant pt-6 space-y-1">
    <div class="px-4 py-3 flex items-center gap-3">
      <span class="material-symbols-outlined text-primary">account_circle</span>
      <div class="flex flex-col min-w-0">
        <span class="font-bold text-on-surface truncate">{{ auth.user()?.name }}</span>
        <span class="text-body-sm text-on-surface-variant text-[12px] truncate">{{ auth.user()?.email }}</span>
      </div>
    </div>
    <button (click)="logout()"
      class="w-full hover:bg-surface-container transition-colors px-4 py-3 flex items-center gap-3 text-error rounded-lg">
      <span class="material-symbols-outlined">logout</span>
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>

<main class="ml-[280px] min-h-screen">
  <router-outlet />
</main>
